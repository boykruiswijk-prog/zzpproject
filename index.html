    <!-- Clickjacking-bescherming zolang er geen X-Frame-Options-header mogelijk is -->
    <script>
      (function () {
        try {
          if (window.top === window.self) return;
          var host = "";
          try { host = window.top.location.hostname; } catch (e) { host = ""; }
          var allowed = ["lovable.app", "lovable.dev", "localhost", "zpzaken.nl"];
          var ok = allowed.some(function (d) { return host === d || host.endsWith("." + d); });
          if (!ok) window.top.location = window.self.location.href;
        } catch (e) {
          document.documentElement.style.display = "none";
        }
      })();
    </script>
